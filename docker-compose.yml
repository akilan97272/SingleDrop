services:

  # ── SingleDrop Backend ────────────────────────────────────────────────
  backend:
    build: .
    container_name: singledrop-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      CORS_ORIGINS: "*"
      JSON_STORE_PATH: /srv/SingleDrop

    volumes:
      # Persistent JSON file storage
      - /srv/SingleDrop:/srv/SingleDrop

    ports:
      - "8102:8000"